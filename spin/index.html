<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo TV Edition - Sound Enabled</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800;900&display=swap');
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #0b132b;
            overflow: hidden;
        }
        .ball-spinning {
            animation: ballRotate 0.08s linear infinite;
        }
        @keyframes ballRotate {
            0% { transform: scale(0.95) translateY(-5px); opacity: 0.6; }
            50% { transform: scale(1.02) translateY(5px); opacity: 0.9; }
            100% { transform: scale(0.95) translateY(-5px); opacity: 0.6; }
        }
    </style>
</head>
<body class="text-white h-screen w-screen flex items-center justify-center p-4 select-none">

    <audio id="soundSpin" src="spinning.mp3" preload="auto" loop></audio>
    <audio id="soundWin" src="win.mp3" preload="auto"></audio>

    <div class="w-full h-full max-w-[1920px] max-h-[1080px] grid grid-cols-12 gap-6 p-4 bg-slate-900/40 rounded-3xl border-2 border-slate-800 shadow-2xl overflow-hidden">
        
        <div class="col-span-7 flex flex-col h-full bg-slate-950/60 border border-slate-800 rounded-2xl p-4 shadow-inner overflow-hidden">
            <div class="flex-1 w-full h-full flex flex-col">
                <table class="w-full h-full border-separate border-spacing-2 text-center table-fixed flex flex-col">
                    <thead class="w-full block">
                        <tr class="text-4xl font-black text-amber-400 tracking-wider grid grid-cols-5 w-full">
                            <th class="py-1">B</th>
                            <th class="py-1">I</th>
                            <th class="py-1">N</th>
                            <th class="py-1">G</th>
                            <th class="py-1">O</th>
                        </tr>
                    </thead>
                    <tbody id="bingoTableBody" class="w-full flex-1 flex flex-col justify-between">
                        </tbody>
                </table>
            </div>
        </div>

        <div class="col-span-5 flex flex-col justify-between h-full bg-slate-950/80 border border-slate-800 rounded-2xl p-6 relative shadow-2xl">
            
            <div class="text-center">
                <h2 class="text-xl font-bold tracking-wider text-slate-400 uppercase">BINGO CONTROL PANEL</h2>
                <div class="mt-2 text-xs text-slate-500 flex justify-center items-center gap-2">
                    <span>ขีดจำกัดตัวเลข:</span>
                    <input type="number" id="maxNumber" value="75" min="15" max="100" 
                           class="w-14 bg-slate-900 text-amber-400 border border-slate-700 rounded text-center font-bold py-0.5 focus:outline-none focus:border-amber-400">
                </div>
            </div>

            <div class="flex-1 flex flex-col items-center justify-center my-4">
                <div id="topStatusText" class="text-amber-400 font-black text-2xl uppercase tracking-widest mb-4">
                    หมายเลขล่าสุดคือ :
                </div>
                
                <div class="w-72 h-72 md:w-80 md:h-80 bg-gradient-to-br from-slate-100 to-slate-300 rounded-full shadow-[0_0_50px_rgba(255,255,255,0.15)] flex items-center justify-center border-8 border-slate-400/30 relative overflow-hidden">
                    <div class="absolute top-4 left-8 w-16 h-8 bg-white/40 rounded-full blur-sm transform -rotate-12"></div>
                    <div id="luckyNumber" class="text-slate-900 font-black text-[9.5rem] leading-none select-none tracking-tighter drop-shadow-md">
                        --
                    </div>
                </div>

                <div id="bottomStatusText" class="text-amber-400 font-bold text-lg mt-6 tracking-wide h-6">พร้อมเริ่มสนุก!</div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <button id="spinBtn" onclick="spinNumber()" class="col-span-2 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-black text-2xl py-4 rounded-xl shadow-lg border-b-4 border-orange-800 active:border-b-0 active:translate-y-1 transition-all cursor-pointer text-center uppercase">
                    SPIN (3s)
                </button>
                <button id="resetBtn" onclick="resetGame()" class="col-span-1 bg-gradient-to-r from-rose-700 to-red-800 hover:from-rose-600 hover:to-red-700 text-white font-bold text-lg py-4 rounded-xl shadow-lg border-b-4 border-red-950 active:border-b-0 active:translate-y-1 transition-all cursor-pointer text-center uppercase">
                    RESET
                </button>
            </div>

        </div>
    </div>

    <script>
        let maxNum = 75;
        let drawnNumbers = [];
        let isSpinning = false;

        const maxNumberInput = document.getElementById('maxNumber');
        const luckyNumberEl = document.getElementById('luckyNumber');
        const topStatusText = document.getElementById('topStatusText');
        const bottomStatusText = document.getElementById('bottomStatusText');
        const spinBtn = document.getElementById('spinBtn');
        const bingoTableBody = document.getElementById('bingoTableBody');

        // ดึง Element ของเสียงมาเก็บในตัวแปร
        const soundSpin = document.getElementById('soundSpin');
        const soundWin = document.getElementById('soundWin');

        maxNumberInput.addEventListener('change', function() {
            let val = parseInt(this.value);
            if (isNaN(val) || val < 15) val = 15;
            maxNum = val;
            resetGame();
        });

        function generateTable() {
            bingoTableBody.innerHTML = '';
            const rowsCount = Math.ceil(maxNum / 5); 

            for (let i = 0; i < rowsCount; i++) {
                const tr = document.createElement('tr');
                tr.className = "grid grid-cols-5 w-full flex-1 gap-2 my-0.5";

                for (let col = 0; col < 5; col++) {
                    const td = document.createElement('td');
                    td.className = "flex items-center justify-center font-bold text-2xl bg-slate-900/40 border border-slate-800/80 rounded-xl text-slate-600 transition-all duration-300 w-full h-full";
                    
                    const currentNum = (col * rowsCount) + i + 1;

                    if (currentNum <= maxNum) {
                        td.innerText = currentNum;
                        td.id = `num-${currentNum}`;
                    } else {
                        td.innerText = ''; 
                        td.className = "bg-transparent border-0 pointer-events-none w-full h-full";
                    }
                    tr.appendChild(td);
                }
                bingoTableBody.appendChild(tr);
            }
        }

        function spinNumber() {
            if (isSpinning) return;
            
            if (drawnNumbers.length >= maxNum) {
                bottomStatusText.innerText = "🎉 ออกครบทุกหมายเลขแล้ว! 🎉";
                bottomStatusText.className = "text-amber-400 font-extrabold animate-bounce text-xl";
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            maxNumberInput.disabled = true;
            spinBtn.classList.add('opacity-40', 'cursor-not-allowed');

            // 🔊 เริ่มเล่นเสียงตอนหมุน (ตั้ง Loop ไว้ในแท็ก HTML แล้วจะดังต่อเนื่อง)
            soundSpin.currentTime = 0; // รีเซ็ตเสียงไปจุดเริ่มต้น
            soundSpin.play().catch(e => console.log("บราวเซอร์บล็อกเสียงเริ่มต้น: ต้องคลิกหน้าจอก่อนหนึ่งครั้ง"));

            let timeLeft = 3; 
            bottomStatusText.className = "text-cyan-400 font-bold animate-pulse";
            bottomStatusText.innerText = `กำลังสุ่มหมายเลข... (${timeLeft} วินาที)`;
            topStatusText.innerText = "กำลังหมุนลูกบอล :";
            topStatusText.className = "text-cyan-400 font-black text-2xl uppercase tracking-widest mb-4 animate-pulse";

            luckyNumberEl.classList.add('ball-spinning');
            const intervalEffect = setInterval(() => {
                let randomTemp = Math.floor(Math.random() * maxNum) + 1;
                luckyNumberEl.innerText = randomTemp;
            }, 60);

            const countdownInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    bottomStatusText.innerText = `กำลังสุ่มหมายเลข... (${timeLeft} วินาที)`;
                } else {
                    clearInterval(countdownInterval);
                }
            }, 1000);

            setTimeout(() => {
                clearInterval(intervalEffect);
                luckyNumberEl.classList.remove('ball-spinning');

                // 🛑 หยุดเสียงหมุน และ 🔊 เล่นเสียงหยุด/ชนะ
                soundSpin.pause();
                soundWin.currentTime = 0;
                soundWin.play();

                let uniqueNumber;
                do {
                    uniqueNumber = Math.floor(Math.random() * maxNum) + 1;
                } while (drawnNumbers.includes(uniqueNumber));

                drawnNumbers.push(uniqueNumber);
                luckyNumberEl.innerText = uniqueNumber;
                
                topStatusText.innerText = "หมายเลขล่าสุดคือ :";
                topStatusText.className = "text-amber-400 font-black text-2xl uppercase tracking-widest mb-4";
                bottomStatusText.innerText = ""; 

                const tableCell = document.getElementById(`num-${uniqueNumber}`);
                if (tableCell) {
                    tableCell.className = "flex items-center justify-center font-black text-3xl bg-gradient-to-b from-amber-400 to-orange-500 text-slate-950 border border-amber-300 rounded-xl shadow-[0_0_15px_rgba(245,158,11,0.6)] scale-105 transform transition-all duration-300 w-full h-full";
                }

                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.classList.remove('opacity-40', 'cursor-not-allowed');
            }, 3000);
        }

        function resetGame() {
            // หยุดเสียงทั้งหมดเมื่อกดรีเซ็ต
            soundSpin.pause();
            soundWin.pause();

            drawnNumbers = [];
            isSpinning = false;
            spinBtn.disabled = false;
            maxNumberInput.disabled = false;
            spinBtn.classList.remove('opacity-40', 'cursor-not-allowed');
            
            luckyNumberEl.innerText = '--';
            topStatusText.innerText = "หมายเลขล่าสุดคือ :";
            topStatusText.className = "text-amber-400 font-black text-2xl uppercase tracking-widest mb-4";
            bottomStatusText.innerText = "บอร์ดรีเซ็ตเรียบร้อย เริ่มเกมใหม่ได้เลย!";
            bottomStatusText.className = "text-amber-400 font-bold";

            generateTable();
        }

        generateTable();
    </script>
</body>
</html>
